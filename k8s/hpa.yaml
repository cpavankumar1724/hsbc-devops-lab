apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab-app-hpa
  namespace: hsbc-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
