[lab]
ansible-target-vm ansible_host=REPLACE_WITH_IAP_PROXY_COMMAND_OUTPUT

# You will not connect directly by IP since the VM has no public IP.
# Instead, run this once to open a local tunnel, then point Ansible at
# 127.0.0.1 on the forwarded port:
#
#   gcloud compute start-iap-tunnel ansible-target-vm 22 \
#     --local-host-port=localhost:2222 --zone=us-central1-a
#
# Then change the line above to:
#   ansible-target-vm ansible_host=127.0.0.1 ansible_port=2222 ansible_user=YOUR_GCLOUD_USER
